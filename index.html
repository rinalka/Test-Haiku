<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HighQ</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <header>
            <h1>HighQ</h1>
        </header>

        <div class="actions">
            <button id="generate">Make another Moment</button>
            <p id="runStatus" class="run-status">idle</p>
            <p id="backendStatus" class="backend-status">checking backend...</p>
        </div>

        <section class="workspace" aria-label="Found lines and preview">
            <section class="preview-panel">
                <h2>Source preview</h2>
                <p id="previewStatus" class="preview-status">click a found line to preview its source page here.</p>
                <iframe id="previewFrame" title="Source page preview" loading="lazy"></iframe>
                <p class="preview-fallback">if the preview is blank, that site blocks embedding. <a id="openExternal" href="#" target="_blank" rel="noopener noreferrer">open source in new tab</a></p>
            </section>

            <section class="right-panel">
                <section class="poem" aria-live="polite">
                    <p id="haiku">A quiet thought
                    </p>
                    <div class="tts-controls" aria-label="Poem reader controls">
                        <button id="readPoem" type="button">Read poem</button>
                        <button id="pausePoem" type="button" disabled>Pause</button>
                        <button id="stopPoem" type="button" disabled>Stop</button>
                    </div>
                    <p id="ttsStatus" class="tts-status">reader idle</p>
                </section>
            </section>
        </section>

        <section class="ai-output">
            <h2>Model response</h2>
            <pre id="aiOutput">response will appear here after rewrite runs.</pre>
        </section>
    </main>

    <script src="./sources.js"></script>
    <script>
        'use strict';

        // Load source pools from the dedicated source file.
        const {
            feeds,
            bookFeeds = [],
            dailyFeeds = [],
            curiosityFeeds = [],
            scholarlyFeeds = [],
            everydayFeeds = [],
            pageSources = [],
            literatureTopics,
            artTopics,
            placeTopics,
            thingTopics = [],
            weatherPlaces
        } = window.SOURCES;

        const topicGroups = [literatureTopics, artTopics, placeTopics, thingTopics].filter(g => g && g.length);
        const FIXED_PROMPT = `Your task is to construct a short found poem by cutting fragments from these passages and rearranging them.

The result should resemble a machine attempting to speak poetically using language it has collected but does not understand.

Source material

Read all 10 passages and identify interesting fragments of English, usually 2–7 words long.

Use material from at least 7 passages, preferably all 10.

Preserve the exact vocabulary and word order within each fragment whenever possible.

You may make small grammatical adjustments, but do not invent new descriptive language.

Avoid using long, intact clauses from the sources. Break them apart.

Construction

Construct the poem line by line, not sentence by sentence. Do not write prose and then divide it into lines.

Aim for 8–14 short lines and approximately 35–65 words. Hard limit: no more than 15 lines and 90 words.

Most lines should contain 2–6 words. Vary their lengths considerably. Once in a while, a longer phrase or sentence is welcome.

Stitch the fragments together so the poem flows. Use small connecting words of your own — but, and, in, of, so, was, like, where, until — to join one fragment to the next, so the lines run on as if they were one long, strange sentence. Keep each line short even so; the run-on happens across line breaks. The fragments come from unrelated subjects, but the grammar should treat them as if they belong together.

For example (illustration only — never reuse these words), the fragments "sally rooney's uk books withdrawn", "gonna find you somehow" and "the oldest dwelling in the western hemisphere" become:
sally rooney's uk books withdrawn,
but gonna find you somehow
in the oldest dwelling in the western hemisphere

Echoes

Let the poem feel as though its random thoughts are secretly related. Repeat or return to a word or image from an earlier line.

Near the end, include one new line built only from words already used in two or three earlier lines of this poem, spliced into a new combination. One possible shape is "[noun from one line] found in the [noun from another line] of [noun from a third line]", but vary it. It should sound like the poem half-remembering itself. Every word in that line must already appear earlier in the poem.

Simile

Include at least one simile. Take a line and attach "like" or "as" plus a short phrase lifted from a different passage, so that "[a line from the poem]" becomes "[that line] like [a short phrase from another passage]". The result must be grammatically plausible, but the comparison should not make sense as an image: it is a found phrase, not a clever metaphor.

Avoid conventional narrative progression. Do not establish a subject, develop it, and then conclude.

Do not try to make the poem meaningful, symbolic, philosophical, emotionally satisfying, or deliberately absurd.

Poetic character

The poem should have an interesting rhythm when read aloud. Achieve this through repetition, pauses, contrasting line lengths, and the natural sounds of the borrowed language.

Let line breaks create hesitation, surprise, or ambiguity. A line may end in the middle of a grammatical construction.

Use occasional indentation, mostly lowercase letters, and unconventional punctuation, loosely inspired by e. e. cummings.

Allow an occasional grand, scholarly, or authoritative phrase to collide with something mundane or irrelevant.

Avoid rhyme, conventional poetic imagery, clever metaphors, jokes, punchlines, and obvious surrealism.

Most important

Do not make sense on purpose. Do not make nonsense on purpose.

The poem should feel as though a machine has assembled pieces of language according to partially understood rules of grammar and rhythm, without recognizing that the pieces belong to unrelated subjects.

Prefer an intriguing grammatical accident over a beautiful sentence.

Prefer a run-on connection over a list of separate fragments.

Output only the poem — at most 15 lines and 90 words — without title, commentary, or explanation. `;

        const $ = id => document.getElementById(id);
        let lastSelectionKey = '';
        let lastPoem = '';
        let busyTimer = null;
        let busyTick = 0;
        let rewriteInFlight = false;
        const generateButtonLabel = 'Make another Moment';
        let progressPhase = 'idle';
        let progressLines = 0;
        let progressStartedAt = 0;
        const SOURCE_TIMEOUT_MS = 4500;
        const speechSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
        let ttsReading = false;
        let ttsPaused = false;
        let ttsCurrentLine = -1;
        let ttsCurrentUtterance = null;
        let ttsAudio = null;

        const random = a => a[Math.floor(Math.random() * a.length)];

        function setProgress(phase, linesCount = progressLines) {
            progressPhase = phase;
            progressLines = linesCount;
        }

        function setTtsStatus(message) {
            $('ttsStatus').textContent = message;
        }

        function clearActiveLine() {
            document.querySelectorAll('#haiku .poem-link.active').forEach(n => n.classList.remove('active'));
        }

        function setActiveLine(index) {
            clearActiveLine();
            const nodes = [...document.querySelectorAll('#haiku .poem-link')];
            if (index >= 0 && index < nodes.length) {
                nodes[index].classList.add('active');
            }
        }

        function updateTtsButtons() {
            const hasPoem = currentModelPoemLines().length > 0;
            $('readPoem').disabled = ttsReading || !hasPoem;
            $('pausePoem').disabled = !ttsReading;
            $('stopPoem').disabled = !ttsReading;
            $('pausePoem').textContent = ttsPaused ? 'Resume' : 'Pause';
        }

        function stopPoemReading(statusMessage = 'reader stopped') {
            if (speechSupported) {
                window.speechSynthesis.cancel();
            }
            if (ttsAudio) {
                ttsAudio.pause();
                URL.revokeObjectURL(ttsAudio.src);
                ttsAudio = null;
            }
            ttsReading = false;
            ttsPaused = false;
            ttsCurrentLine = -1;
            ttsCurrentUtterance = null;
            clearActiveLine();
            setTtsStatus(statusMessage);
            updateTtsButtons();
        }

        function getPreferredVoice() {
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) {
                return null;
            }

            const isFemaleEnglish = voice => {
                const name = (voice.name || '').toLowerCase();
                const lang = (voice.lang || '').toLowerCase();
                return (name.includes('female') || name.includes('woman') || name.includes('samantha') || name.includes('zira') || name.includes('aria'))
                    && (lang.includes('en') || lang.includes('us') || lang.includes('uk'));
            };

            // Local voices first: Chrome's online voices can cut off long run-on paragraphs.
            const preferred = voices.find(voice => isFemaleEnglish(voice) && voice.localService)
                || voices.find(isFemaleEnglish);

            return preferred || voices.find(voice => /en|us|uk/i.test(voice.lang || '')) || voices[0] || null;
        }

        // Browsers load voices asynchronously; without waiting, the first utterance uses the default voice.
        function waitForVoices(ms = 2000) {
            if (window.speechSynthesis.getVoices().length) {
                return Promise.resolve();
            }

            return new Promise(resolve => {
                const done = () => {
                    window.speechSynthesis.removeEventListener('voiceschanged', done);
                    clearTimeout(timer);
                    resolve();
                };
                const timer = setTimeout(done, ms);
                window.speechSynthesis.addEventListener('voiceschanged', done);
            });
        }

        // Each paragraph (separated by blank lines) is read as one run-on sentence, ignoring line breaks.
        function currentModelPoemParagraphs() {
            if (!currentModelPoemLines().length) {
                return [];
            }

            const text = extractPoemFromModelText(($('aiOutput').textContent || '').trim());
            return text
                .split(/\n\s*\n/)
                .map(paragraph => paragraph.replace(/\s+/g, ' ').trim())
                .filter(Boolean);
        }

        function speakLine(lines, index, voice) {
            if (!ttsReading) {
                return;
            }

            if (index >= lines.length) {
                stopPoemReading('reader complete');
                return;
            }

            ttsCurrentLine = index;
            setTtsStatus(`reading paragraph ${index + 1}/${lines.length}`);

            const utter = new SpeechSynthesisUtterance(lines[index]);
            const preferredVoice = voice;
            utter.voice = preferredVoice;
            utter.rate = 0.9;
            utter.pitch = 1.2;
            utter.volume = 1;
            utter.lang = preferredVoice ? preferredVoice.lang : 'en-US';
            utter.onend = () => {
                if (!ttsReading || ttsPaused) {
                    return;
                }
                speakLine(lines, index + 1, voice);
            };
            utter.onerror = () => {
                stopPoemReading('reader failed on this browser/voice');
            };

            ttsCurrentUtterance = utter;
            window.speechSynthesis.speak(utter);
        }

        // Backend voice performs the poem with emotion and pauses; resolves false if unavailable.
        async function playBackendReading(text) {
            try {
                const response = await fetch('/api/speak', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text})
                });
                if (!response.ok) {
                    return false;
                }

                const blob = await response.blob();
                if (!ttsReading) {
                    return true;
                }

                ttsAudio = new Audio(URL.createObjectURL(blob));
                ttsAudio.onended = () => stopPoemReading('reader complete');
                ttsAudio.onerror = () => stopPoemReading('reader failed to play audio');
                await ttsAudio.play();
                setTtsStatus('reading poem');
                return true;
            } catch (e) {
                return false;
            }
        }

        async function startPoemReading() {
            const paragraphs = currentModelPoemParagraphs();
            if (!paragraphs.length) {
                setTtsStatus('no model response to read yet');
                return;
            }

            stopPoemReading('preparing voice... this may take 5-15 seconds.');
            ttsReading = true;
            ttsPaused = false;
            updateTtsButtons();

            const poemText = extractPoemFromModelText(($('aiOutput').textContent || '').trim());
            if (await playBackendReading(poemText)) {
                return;
            }

            if (!speechSupported) {
                stopPoemReading('speech synthesis not supported in this browser');
                return;
            }

            await waitForVoices();
            speakLine(paragraphs, 0, getPreferredVoice());
        }

        function togglePoemPause() {
            if (!ttsReading) {
                return;
            }

            if (ttsAudio) {
                ttsPaused = !ttsPaused;
                if (ttsPaused) {
                    ttsAudio.pause();
                } else {
                    ttsAudio.play();
                }
                setTtsStatus(ttsPaused ? 'paused' : 'reading poem');
                updateTtsButtons();
                return;
            }

            if (!ttsPaused) {
                window.speechSynthesis.pause();
                ttsPaused = true;
                setTtsStatus(`paused at paragraph ${ttsCurrentLine + 1}`);
            } else {
                window.speechSynthesis.resume();
                ttsPaused = false;
                setTtsStatus(`reading paragraph ${ttsCurrentLine + 1}`);
            }

            updateTtsButtons();
        }

        function startBusy() {
            const btn = $('generate');
            btn.disabled = true;
            btn.style.opacity = '1';
            busyTick = 0;
            progressStartedAt = Date.now();
            setProgress('finding lines', 0);

            if (busyTimer) {
                clearInterval(busyTimer);
            }

            busyTimer = setInterval(() => {
                busyTick++;
                btn.style.opacity = busyTick % 2 ? '0.45' : '1';
                const secs = Math.floor((Date.now() - progressStartedAt) / 1000);
                const phaseLabel = progressPhase === 'rewriting' ? 'rewriting' : 'finding';
                btn.textContent = `${phaseLabel} ${progressLines}/10 · ${secs}s`;
            }, 220);
        }

        function stopBusy() {
            const btn = $('generate');
            if (busyTimer) {
                clearInterval(busyTimer);
                busyTimer = null;
            }
            btn.style.opacity = '1';
            btn.disabled = false;
            btn.textContent = generateButtonLabel;
            setProgress('idle', 0);
        }

        function sampleWithoutReplacement(arr, count) {
            const copy = [...arr];
            const out = [];
            const limit = Math.min(count, copy.length);

            for (let i = 0; i < limit; i++) {
                const idx = Math.floor(Math.random() * copy.length);
                out.push(copy[idx]);
                copy.splice(idx, 1);
            }

            return out;
        }

        function clean(s) {
            const d = document.createElement('div');
            d.innerHTML = s || '';
            return (d.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 900);
        }

        function trimAtWordBoundary(text, maxChars) {
            if (text.length <= maxChars) {
                return text.trim();
            }

            const slice = text.slice(0, maxChars + 1);
            const lastSpace = slice.lastIndexOf(' ');
            if (lastSpace > 0) {
                return slice.slice(0, lastSpace).trim();
            }

            return text.slice(0, maxChars).trim();
        }

        function dedupeTitleAndDescription(titleText, descriptionText) {
            const title = clean(titleText || '');
            const description = clean(descriptionText || '');

            if (!title && !description) {
                return '';
            }

            if (!description) {
                return title;
            }

            const t = title.toLowerCase();
            const d = description.toLowerCase();

            if (d.includes(t)) {
                return description;
            }

            if (t.includes(d)) {
                return title;
            }

            // Prefer the title as the primary found line; use description only when title is very short.
            if (title.length >= 40) {
                return title;
            }

            return clean(`${title}. ${description}`);
        }

        function looksListLike(text) {
            const t = text.toLowerCase();
            const commaCount = (text.match(/,/g) || []).length;
            if (/may refer to|can refer to|disambiguation/.test(t)) {
                return true;
            }
            if (commaCount >= 5 && !/[.!?]/.test(text)) {
                return true;
            }
            if (/\ba\b[^.!?]{0,40},\s*a\b[^.!?]{0,40},\s*a\b/.test(t)) {
                return true;
            }
            return false;
        }

        // Shared JSON fetch helper with timeout.
        async function fetchWithTimeout(url, ms = SOURCE_TIMEOUT_MS) {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), ms);

            try {
                const r = await fetch(url, {signal: c.signal});
                if (!r.ok) {
                    throw Error('HTTP ' + r.status);
                }
                return await r.json();
            } finally {
                clearTimeout(t);
            }
        }

        async function fetchTextThroughRelays(url, ms = SOURCE_TIMEOUT_MS) {
            // Public relays: no credentials; subject to third-party availability.
            const relays = [
                '/api/feed?url=' + encodeURIComponent(url),
                'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
                'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url)
            ];
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), ms);

            try {
                const attempts = relays.map(async relay => {
                    const r = await fetch(relay, {signal: c.signal});
                    if (!r.ok) {
                        throw Error(`relay failed (${r.status})`);
                    }
                    return await r.text();
                });

                return await Promise.any(attempts);
            } finally {
                clearTimeout(t);
            }
        }

        async function rssSource(source, kind) {
            try {
                const raw = await fetchTextThroughRelays(source.url);
                const xml = new DOMParser().parseFromString(raw, 'text/xml');
                // RSS uses <item>; Atom feeds (e.g. Blogger) use <entry>.
                const items = [...xml.querySelectorAll('item, entry')].slice(0, 60);
                if (!items.length) {
                    throw Error('empty feed');
                }

                const item = random(items);
                const titleText = item.querySelector('title')?.textContent || '';
                const descriptionText = item.querySelector('description, summary')?.textContent || '';
                const linkNode = item.querySelector('link[rel="alternate"]') || item.querySelector('link');
                return {
                    name: source.name,
                    title: dedupeTitleAndDescription(titleText, descriptionText),
                    link: linkNode?.textContent || linkNode?.getAttribute('href') || source.url,
                    ok: true,
                    kind
                };
            } catch (e) {
                return {
                    name: source.name,
                    title: '',
                    link: source.url,
                    ok: false,
                    kind
                };
            }
        }

        const weatherCode = c => (
            c === 0 ? 'clear skies'
            : c <= 3 ? 'clouds and sun'
            : c <= 48 ? 'mist and fog'
            : c <= 67 ? 'rain'
            : c <= 77 ? 'snow'
            : c <= 82 ? 'rain showers'
            : c <= 86 ? 'snow showers'
            : 'stormy skies'
        );

        // Pull current weather for one selected place.
        async function weather(name, lat, lon) {
            try {
                const j = await fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`);
                const w = j.current;
                return {
                    name,
                    title: `${Math.round(w.temperature_2m)}°C, ${weatherCode(w.weather_code)}`,
                    ok: true,
                    link: `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`,
                    kind: 'weather'
                };
            } catch (e) {
                return {
                    name,
                    title: '',
                    ok: false,
                    link: 'https://open-meteo.com/en/docs',
                    kind: 'weather'
                };
            }
        }

        // Pull pages related to a chosen Wikipedia topic.
        async function wikipediaRelated(topic) {
            const [name, page] = topic;
            const seed = page.replaceAll('_', ' ');

            try {
                // Random offset so repeated topics surface different related pages.
                const search = await fetchWithTimeout(
                    'https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='
                    + encodeURIComponent(seed)
                    + '&srlimit=10&sroffset=' + Math.floor(Math.random() * 40)
                    + '&format=json&origin=*'
                );
                const hits = search.query?.search || [];
                if (!hits.length) {
                    throw Error('no related pages');
                }
                const hit = random(hits);
                const title = hit.title;
                const link = 'https://en.wikipedia.org/wiki/' + encodeURIComponent(title.replace(/\s+/g, '_'));

                const rawText = clean(hit.snippet || title);
                const sentences = (rawText.match(/[^.!?;:]+[.!?;:]?/g) || [])
                    .map(s => s.trim())
                    .filter(Boolean);

                const sentence = sentences.find(s => s.length >= 30 && !looksListLike(s)) || '';
                const snippet = sentence || rawText;
                if (!snippet || looksListLike(snippet)) {
                    throw Error('list-like wiki text');
                }

                return {
                    name: 'Wikipedia · ' + title,
                    title: snippet,
                    link,
                    ok: true,
                    kind: 'wiki'
                };
            } catch (e) {
                return {
                    name: 'Wikipedia · ' + name,
                    title: '',
                    link: 'https://en.wikipedia.org/wiki/' + page,
                    ok: false,
                    kind: 'wiki'
                };
            }
        }

        function syllables(word) {
            const w = word.toLowerCase().replace(/[^a-z]/g, '');
            if (!w) {
                return 0;
            }
            if (w.length <= 3) {
                return 1;
            }

            const trimmed = w
                .replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/i, '')
                .replace(/^y/i, '');

            const groups = trimmed.match(/[aeiouy]{1,2}/gi);
            return Math.max(1, groups ? groups.length : 1);
        }
        function chunkFromText(text, minChars = 80, maxChars = 360) {
            const normalized = clean(text);
            if (normalized.length < minChars) {
                return '';
            }

            const sentences = (normalized.match(/[^.!?;:]+[.!?;:]?/g) || [])
                .map(s => s.trim())
                .filter(Boolean);

            // First choice: whole sentence that already reads like a complete thought.
            const completeCandidates = sentences
                .filter(s => s.length >= minChars)
                .map(s => trimAtWordBoundary(s, maxChars))
                .filter(s => !looksListLike(s))
                .filter(s => s.length >= minChars);

            if (completeCandidates.length) {
                return random(completeCandidates).toLowerCase();
            }

            // Fallback: extract a longer segment and cut at sentence punctuation when possible.
            const source = normalized;
            if (source.length < minChars) {
                return '';
            }

            for (let attempt = 0; attempt < 20; attempt++) {
                const maxStart = Math.max(0, source.length - minChars);
                const start = Math.floor(Math.random() * (maxStart + 1));
                const window = source.slice(start, start + maxChars);
                if (window.length < minChars) {
                    continue;
                }

                const punctAt = window.slice(minChars - 1).search(/[.!?;:]/);
                if (punctAt >= 0) {
                    const end = minChars - 1 + punctAt + 1;
                    const candidate = window.slice(0, end).trim();
                    if (candidate.length >= minChars) {
                        return candidate.toLowerCase();
                    }
                }

                const spaceAt = window.lastIndexOf(' ');
                const candidate = (spaceAt > minChars ? window.slice(0, spaceAt) : window).trim();
                if (candidate.length >= minChars) {
                    return candidate.toLowerCase();
                }
            }

            const fallback = source.slice(0, maxChars).trim();
            return fallback.length >= minChars ? fallback : '';
        }

        function uniquePastelColor(usedColors) {
            for (let i = 0; i < 80; i++) {
                const hue = Math.floor(Math.random() * 360);
                const sat = 60 + Math.floor(Math.random() * 20);
                const light = 84 + Math.floor(Math.random() * 10);
                const color = `hsl(${hue} ${sat}% ${light}%)`;
                if (!usedColors.has(color)) {
                    return color;
                }
            }

            const fallback = `hsl(${(usedColors.size * 37) % 360} 70% 88%)`;
            return fallback;
        }

        let previewTimer = null;

        function loadPreview(url) {
            const frame = $('previewFrame');
            const status = $('previewStatus');
            const open = $('openExternal');

            open.href = url;
            status.textContent = 'loading source page...';
            frame.src = url;

            if (previewTimer) {
                clearTimeout(previewTimer);
            }

            previewTimer = setTimeout(() => {
                status.textContent = 'if this stays blank, i might try and fix it. or not. if you must open source in new tab.';
            }, 5000);
        }

        function renderPoemLines(lineEntries) {
            const poem = $('haiku');
            poem.replaceChildren();

            lineEntries.forEach(entry => {
                const line = document.createElement('a');
                line.className = 'poem-line poem-link';
                line.textContent = entry.text;
                line.style.backgroundColor = entry.color;
                line.style.color = '#000';
                line.href = entry.url;
                line.target = '_blank';
                line.rel = 'noopener noreferrer';
                line.addEventListener('click', event => {
                    event.preventDefault();
                    loadPreview(entry.url);
                });
                poem.append(line);
            });

            updateTtsButtons();
        }

        // Any Wikipedia article at all, for material no topic list would reach.
        async function wikipediaRandom() {
            try {
                const page = await fetchWithTimeout('https://en.wikipedia.org/api/rest_v1/page/random/summary');
                const text = clean(page.extract || '');
                if (!text || looksListLike(text)) {
                    throw Error('unusable random page');
                }

                return {
                    name: 'Wikipedia · ' + page.title,
                    title: text,
                    link: page.content_urls?.desktop?.page || 'https://en.wikipedia.org/wiki/' + encodeURIComponent(page.title),
                    ok: true,
                    kind: 'wikiRandom'
                };
            } catch (e) {
                return {name: 'Wikipedia · random', title: '', link: '#', ok: false, kind: 'wikiRandom'};
            }
        }

        // Song lyrics and poems scraped by the backend (unavailable in static mode).
        async function pageSource(source) {
            try {
                const j = await fetchWithTimeout('/api/page?index=' + encodeURIComponent(source.index), 12000);
                if (!j.text) {
                    throw Error('no text');
                }
                return {name: source.name, title: j.text, link: j.link, ok: true, kind: 'verse'};
            } catch (e) {
                return {name: source.name, title: '', link: source.index, ok: false, kind: 'verse'};
            }
        }

        // Feed pools by kind; 'daily' is listed once because it changes only once a day.
        const feedPools = {
            news: feeds,
            daily: dailyFeeds,
            curiosity: curiosityFeeds,
            scholarly: scholarlyFeeds,
            everyday: everydayFeeds
        };

        async function randomSourceItem(allowWeather = true) {
            const kinds = ['news', 'news', 'books', 'daily', 'curiosity', 'curiosity', 'scholarly', 'everyday', 'wiki', 'wikiRandom', 'wikiRandom', 'verse'];
            if (allowWeather) {
                kinds.push('weather');
            }
            const kind = random(kinds);

            if (feedPools[kind] && feedPools[kind].length) {
                return await rssSource(random(feedPools[kind]), kind);
            }

            if (kind === 'verse' && pageSources.length) {
                return await pageSource(random(pageSources));
            }

            if (kind === 'wikiRandom') {
                return await wikipediaRandom();
            }

            if (kind === 'books') {
                const pool = bookFeeds.length ? bookFeeds : feeds;
                if (pool.length) {
                    return await rssSource(random(pool), 'books');
                }
            }

            if (kind === 'weather' && weatherPlaces.length) {
                return await weather(...random(weatherPlaces));
            }

            const group = random(topicGroups);
            if (group && group.length) {
                return await wikipediaRelated(random(group));
            }

            return {ok: false, title: '', name: 'source unavailable', link: '#', kind};
        }

        function currentFoundLines() {
            const lineNodes = [...document.querySelectorAll('#haiku .poem-line')];
            if (lineNodes.length) {
                return lineNodes.map(n => n.textContent.trim()).filter(Boolean);
            }

            return ($('haiku').textContent || '')
                .split('\n')
                .map(s => s.trim())
                .filter(Boolean)
                .filter(s => !/^searching for lines/i.test(s))
                .filter(s => !/^no lines found/i.test(s));
        }

        function extractPoemFromModelText(rawText) {
            let text = (rawText || '').replace(/\r/g, '').trim();
            if (!text) {
                return '';
            }

            const fenced = text.match(/```(?:\w+)?\n([\s\S]*?)```/);
            if (fenced && fenced[1]) {
                text = fenced[1].trim();
            }

            const markerPatterns = [
                /(?:^|\n)found\s+poem\s*:\s*/i,
                /(?:^|\n)poem\s*:\s*/i,
                /(?:^|\n)final\s+poem\s*:\s*/i,
                /(?:^|\n)here(?:'|’)s\s+the\s+poem\s*:\s*/i,
                /(?:^|\n)here\s+is\s+the\s+poem\s*:\s*/i
            ];

            markerPatterns.forEach(pattern => {
                const m = text.match(pattern);
                if (m && typeof m.index === 'number') {
                    text = text.slice(m.index + m[0].length).trim();
                }
            });

            // Keep leading spaces: the prompt asks for cummings-style indentation.
            const lines = text.split('\n').map(line => line.trimEnd());
            const isMetaLine = rawLine => {
                const line = rawLine.trim();
                if (!line) {
                    return true;
                }

                if (/^(certainly|sure|first\b|second\b|third\b|i\s*(?:'|’)ll|i\s+will|let\s*(?:'|’)s|here(?:'|’)s|here\s+is)\b/i.test(line)) {
                    return true;
                }

                if (/(parse|craft|rework|found poem in the style|semantically loose|grammatically coherent)/i.test(line)) {
                    return true;
                }

                return false;
            };

            let start = 0;
            while (start < lines.length && isMetaLine(lines[start])) {
                start += 1;
            }

            return lines.slice(start).join('\n').trimEnd();
        }

        function currentModelPoemLines() {
            const text = extractPoemFromModelText(($('aiOutput').textContent || '').trim());
            if (!text) {
                return [];
            }

            if (/^response will appear here/i.test(text) || /^waiting for model response/i.test(text) || /^could not get model response/i.test(text)) {
                return [];
            }

            return text
                .split('\n')
                .map(s => s.trim())
                .filter(Boolean);
        }

        function setExportStatus(message) {
            $('runStatus').textContent = message;
        }

        async function checkBackendHealth() {
            $('backendStatus').textContent = 'checking backend...';

            try {
                const r = await fetch('/api/health', {cache: 'no-store'});
                if (!r.ok) {
                    throw Error(`health check failed (${r.status})`);
                }

                const health = await r.json();
                if (health.ok && health.hasKey) {
                    $('backendStatus').textContent = 'backend connected · api key detected';
                } else if (health.ok && !health.hasKey) {
                    $('backendStatus').textContent = 'backend connected · api key missing in .env';
                } else {
                    $('backendStatus').textContent = 'backend reachable but health check is invalid';
                }
            } catch (e) {
                $('backendStatus').textContent = 'static GitHub Pages mode · backend unavailable';
            }
        }

        function setAiOutput(message) {
            const cleaned = extractPoemFromModelText(message);
            $('aiOutput').textContent = cleaned || message;
            updateTtsButtons();
        }

        async function rewriteInHighQ(linesOverride) {
            if (rewriteInFlight) {
                setExportStatus('rewrite already running...');
                return;
            }

            const lines = linesOverride || currentFoundLines();
            if (!lines.length) {
                setExportStatus('no lines yet. generate a poem first.');
                return;
            }

            const prompt = FIXED_PROMPT;
            const browserKey = localStorage.getItem('highq_openai_key') || localStorage.getItem('openai_api_key');

            rewriteInFlight = true;
            setProgress('rewriting', lines.length);
            setExportStatus('sending lines to model... this may take 5-20 seconds.');
            setAiOutput('waiting for model response...');

            try {
                let text = '';
                const backendAvailable = await fetch('/api/health', {cache: 'no-store'}).then(r => r.ok).catch(() => false);

                if (backendAvailable) {
                    const response = await fetch('/api/rewrite', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            prompt,
                            lines
                        })
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw Error(`request failed (${response.status}): ${errText.slice(0, 240)}`);
                    }

                    const payload = await response.json();
                    text = (payload.text || '').trim();
                } else if (browserKey) {
                    const response = await fetch('https://api.openai.com/v1/responses', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${browserKey}`
                        },
                        body: JSON.stringify({
                            model: 'gpt-4o-mini',
                            input: [
                                {role: 'system', content: prompt},
                                {role: 'user', content: lines.map((line, index) => `${index + 1}. ${line}`).join('\n')}
                            ]
                        })
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw Error(`OpenAI request failed (${response.status}): ${errText.slice(0, 240)}`);
                    }

                    const payload = await response.json();
                    text = (payload.output_text || payload.output?.map(item => item.content || []).flat().map(c => c.text || '').join('\n') || '').trim();
                } else {
                    throw Error('static GitHub Pages build has no backend. set a browser key in localStorage as highq_openai_key.');
                }

                if (!text) {
                    throw Error('model returned no text output');
                }

                setAiOutput(text);
                setExportStatus('rewrite complete.');
                setTtsStatus('rewrite ready. click read poem.');
            } catch (e) {
                setAiOutput('could not get model response.');
                setExportStatus(`rewrite failed: ${e.message}`);
                setTtsStatus('reader idle');
            } finally {
                rewriteInFlight = false;
            }
        }

        // Build 10 lines by repeatedly pulling random sources and slicing random text chunks.
        // Lines used in recent runs are skipped so slow-changing feeds don't repeat.
        const RECENT_LINES_KEY = 'highq_recent_lines';

        function loadRecentLines() {
            try {
                return JSON.parse(localStorage.getItem(RECENT_LINES_KEY) || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveRecentLines(list) {
            try {
                localStorage.setItem(RECENT_LINES_KEY, JSON.stringify(list.slice(0, 80)));
            } catch (e) {
                // Storage unavailable: repeats are merely more likely.
            }
        }

        async function refresh() {
            if (ttsReading) {
                stopPoemReading('reader stopped: new lines incoming');
            }

            startBusy();

            try {
                const lines = [];
                const recentLines = loadRecentLines();
                const usedUrls = new Set();
                const usedSourceNames = new Set();
                let verseCount = 0;
                const usedColors = new Set();
                let weatherUsed = false;

                $('haiku').textContent = 'searching for lines...';
                setExportStatus('finding source lines...');

                for (let round = 0; round < 30 && lines.length < 10; round++) {
                    const batchSize = Math.min(8, 10 - lines.length + 3);
                    const batch = Array.from({length: batchSize}, () => randomSourceItem(!weatherUsed));
                    const items = await Promise.all(batch);

                    for (const item of items) {
                        if (lines.length >= 10) {
                            break;
                        }

                        if (!item || !item.ok || !item.title) {
                            continue;
                        }

                        if (item.kind === 'weather' && weatherUsed) {
                            continue;
                        }

                        const urlKey = (item.link || '').trim().toLowerCase();
                        if (!urlKey || usedUrls.has(urlKey)) {
                            continue;
                        }

                        // One line per source, and lyrics/poems only as seasoning.
                        if (usedSourceNames.has(item.name) || (item.kind === 'verse' && verseCount >= 2)) {
                            continue;
                        }

                        const line = chunkFromText(item.title, 60, 320);
                        if (!line || recentLines.includes(line)) {
                            continue;
                        }

                        const color = uniquePastelColor(usedColors);
                        lines.push({text: line, color, url: item.link});
                        usedUrls.add(urlKey);
                        usedSourceNames.add(item.name);
                        if (item.kind === 'verse') {
                            verseCount++;
                        }
                        usedColors.add(color);
                        setProgress('finding lines', lines.length);
                        setExportStatus(`found ${lines.length}/10 lines...`);
                        renderPoemLines(lines);

                        if (lines.length === 1) {
                            loadPreview(item.link);
                        }

                        if (item.kind === 'weather') {
                            weatherUsed = true;
                        }
                    }
                }

                if (lines.length === 10) {
                    saveRecentLines([...lines.map(x => x.text), ...recentLines]);
                    lastPoem = lines.map(x => x.text).join('|');
                    renderPoemLines(lines);
                    setExportStatus('10/10 lines found.');

                    setTtsStatus('waiting for rewrite output...');
                    await rewriteInHighQ(lines.map(x => x.text));
                } else {
                    $('haiku').textContent = 'no lines found this round\ntry again for a fresh pull';
                    setExportStatus('line search ended without 10 lines.');
                    setTtsStatus('reader idle');
                }
            } catch (e) {
                $('haiku').textContent = 'no lines found this round\ntry again for a fresh pull';
                setExportStatus(`run failed: ${e.message}`);
                setTtsStatus('reader idle');
            } finally {
                stopBusy();
            }
        }

        $('generate').addEventListener('click', refresh);
        $('readPoem').addEventListener('click', startPoemReading);
        $('pausePoem').addEventListener('click', togglePoemPause);
        $('stopPoem').addEventListener('click', () => {
            stopPoemReading('reader stopped');
        });
        $('previewFrame').addEventListener('load', () => {
            $('previewStatus').textContent = 'preview loaded. if this looks blank, i need to fix it, or not. try to open source in new tab.';
        });
        checkBackendHealth();
        updateTtsButtons();
        refresh();
    </script>
</body>
</html>
