<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HighQ</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#f4f0f6;color:#30213e;font:17px/1.6 Georgia,serif}
main{max-width:790px;margin:0 auto;padding:48px 22px 80px}
header{text-align:center;border-bottom:1px solid #d9d0df;padding-bottom:25px}
h1{font-weight:normal;letter-spacing:.09em;font-size:clamp(40px,7vw,68px);margin:0;color:#291b39}
button{cursor:pointer;background:#49365e;color:#faf8fc;border:0;border-radius:4px;padding:13px 23px;font:600 15px system-ui,sans-serif}
button:hover{background:#352545}button:disabled{opacity:.6;cursor:wait}
.actions{text-align:center;margin:25px 0}
.poem{background:#fbf9fc;border:1px solid #e5deea;text-align:center;padding:55px 20px;box-shadow:0 7px 30px #32243b0a}
.poem p{font-size:clamp(23px,4vw,31px);line-height:1.75;margin:0;white-space:pre-line;color:#30213e}
.sources{margin-top:42px}h2{font:600 14px system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;border-bottom:1px solid #d9d0df;padding-bottom:10px;color:#49365e}
ul{list-style:none;padding:0}li{padding:9px 0;border-bottom:1px solid #e8e1ec;font:14px/1.5 system-ui,sans-serif}
a{color:#47315c;text-decoration:none}a:hover{text-decoration:underline}
</style></head>
<body><main><header><h1>HighQ</h1></header><div class="actions"><button id="generate">Make another haiku</button></div><section class="poem" aria-live="polite"><p id="haiku">A quiet page waits\nFor distant news and weather\nTo stir up the words</p></section><section class="sources"><h2>Today's ingredients</h2><ul id="ingredients"></ul></section></main>
<script>
'use strict';
const feeds=[
 {name:'Reuters',url:'https://news.google.com/rss/search?q=site%3Areuters.com%20when%3A2d&hl=en-US&gl=US&ceid=US:en'},
 {name:'CBC',url:'https://www.cbc.ca/webfeed/rss/rss-topstories'},
 {name:'Ottawa Citizen',url:'https://ottawacitizen.com/feed/'},
 {name:'Google News',url:'https://news.google.com/rss?hl=en-CA&gl=CA&ceid=CA:en'},
 {name:'Washington Post',url:'https://feeds.washingtonpost.com/rss/world'},
 {name:'TSX market movers (news)',url:'https://news.google.com/rss/search?q=TSX%20top%20gainers%20stocks%20today%20when%3A2d&hl=en-CA&gl=CA&ceid=CA:en'}
];
const $=id=>document.getElementById(id);let ingredients=[];
const random=a=>a[Math.floor(Math.random()*a.length)];
function clean(s){const d=document.createElement('div');d.innerHTML=s||'';return(d.textContent||'').replace(/\s+/g,' ').trim().slice(0,160)}
async function fetchWithTimeout(url,ms=11000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function news(feed){
 // Public relay: no credentials; subject to third-party availability.
 const relay='https://api.allorigins.win/raw?url='+encodeURIComponent(feed.url);
 const c=new AbortController(),t=setTimeout(()=>c.abort(),11000);
 try{const r=await fetch(relay,{signal:c.signal});if(!r.ok)throw Error('relay unavailable');const xml=new DOMParser().parseFromString(await r.text(),'text/xml');const items=[...xml.querySelectorAll('item')].slice(0,8);if(!items.length)throw Error('empty feed');const item=random(items);return {name:feed.name,title:clean(item.querySelector('title')?.textContent),link:item.querySelector('link')?.textContent||feed.url,ok:true}}
 catch(e){return{name:feed.name,title:'Headlines temporarily unavailable',link:feed.url,ok:false}}
 finally{clearTimeout(t)}
}
const weatherCode=c=>c===0?'clear skies':c<=3?'clouds and sun':c<=48?'mist and fog':c<=67?'rain':c<=77?'snow':c<=82?'rain showers':c<=86?'snow showers':'stormy skies';
async function weather(name,lat,lon){try{const j=await fetchWithTimeout(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`);const w=j.current;return{name,title:`${Math.round(w.temperature_2m)}°C, ${weatherCode(w.weather_code)}`,ok:true,link:'https://open-meteo.com/en/docs'}}catch(e){return{name,title:'Weather temporarily unavailable',ok:false,link:'https://open-meteo.com/en/docs'}}}
const literatureTopics=[
 ['Literature','Literature'],['Poetry','Poetry'],['Modernist literature','Modernist_literature'],
 ['Haiku','Haiku'],['Canadian literature','Canadian_literature'],['Romantic poetry','Romantic_poetry']
];
const artTopics=[
 ['Art history','Art_history'],['Renaissance art','Renaissance_art'],['Impressionism','Impressionism'],
 ['Electronic music','Electronic_music'],['Computer music','Computer_music'],['History of music','History_of_music'],
 ['Surrealism','Surrealism'],['Baroque music','Baroque_music']
];
const placeTopics=[
 ['Prague','Prague'],['History of Prince Edward Island','History_of_Prince_Edward_Island'],
 ['Prince Edward Island','Prince_Edward_Island'],['Ottawa','Ottawa'],
 ['Torrevieja','Torrevieja'],['Mexico City','Mexico_City'],
 ['Artech Studios','Artech_Digital_Entertainment'],['Burnstown','Burnstown,_Ontario']
];
const weatherPlaces=[
 ['Ottawa weather',45.4215,-75.6972],['Prague weather',50.0755,14.4378],
 ['Torrevieja weather',37.9787,-0.6822],['Mexico City weather',19.4326,-99.1332],
 ['Burnstown weather',45.39,-76.57]
];
async function wikipediaTopic(topic){const [name,page]=topic;const link='https://en.wikipedia.org/wiki/'+page;
 try{const j=await fetchWithTimeout('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&titles='+encodeURIComponent(page.replaceAll('_',' '))+'&format=json&origin=*');const p=Object.values(j.query.pages)[0];if(p.missing!==undefined)throw Error('missing');return{name:'Wikipedia · '+name,title:(p.extract||p.title).slice(0,180),link,ok:true}}
 catch(e){return{name:'Wikipedia · '+name,title:'Read the article',link,ok:false}}
}
async function wikipedia(){try{const j=await fetchWithTimeout('https://en.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&grnlimit=1&prop=info&inprop=url&format=json&origin=*');const p=Object.values(j.query.pages)[0];return{name:'Wikipedia · Random',title:p.title,link:p.fullurl,ok:true}}catch(e){return{name:'Wikipedia · Random',title:'Random article unavailable',link:'https://en.wikipedia.org/wiki/Special:Random',ok:false}}}
// Source-aware, syllable-checked phrase banks: 5 / 7 / 5.
// One line responds to weather, one to news, and one to a selected cultural/place article.
const weatherLines={
 'Ottawa weather':['Ottawa awakes','The river wakes up','Cold air on the bridge'],
 'Prague weather':['Prague roofs greet the dawn','The old city wakes','Morning on the bridge'],
 'Torrevieja weather':['Salt air fills the streets','The blue sea wakes up','Warm light on the shore'],
 'Mexico City weather':['The high city wakes','Mountains hold the dawn','Sun above the streets'],
 'Burnstown weather':['Fields wait for the sun','The old mill stands still','Mist hangs on the hills']
};
const newsLines={
 Reuters:['Far stories cross the oceans','The distant world is turning','New voices fill the morning'],
 CBC:['Across the wide Canadian sky','The country reads the morning','New stories cross the border'],
 'Ottawa Citizen':['The town reads the morning news','The city hears the latest news','The river carries stories'],
 'Google News':['A thousand stories cross the sky','The world unfolds another day','New voices crowd the morning'],
 'Washington Post':['Across the halls of power','The papers carry distant news','The capital is listening'],
 'TSX market movers (news)':['Markets rise and fall again','Trading floors awake at dawn','The numbers move like weather']
};
const culturalLines={
 literature:['Old poems bloom again','Words drift across time','A story takes root','The pages breathe softly'],
 art:['Brushstrokes hold the light','Old paintings still sing','A melody wakes','The colours take flight'],
 place:['Old streets keep their tales','The island remembers','A city dreams on','The past walks beside us']
};
let last='',turn=0;
function pickDifferent(a){let v=random(a);for(let i=0;i<8&&v===last;i++)v=random(a);return v}
function weatherLine(item){
 const lines=weatherLines[item.name]||['The morning unfolds'];
 const t=(item.title||'').toLowerCase();
 if(/snow/.test(t))return 'Snow settles softly';
 if(/rain|showers/.test(t))return 'Rain taps on the roofs';
 if(/clear skies/.test(t))return 'Clear skies greet the dawn';
 if(/mist|fog/.test(t))return 'Mist covers the hills';
 return random(lines);
}
function newsLine(item){
 const t=(item.title||'').toLowerCase();
 if(/market|stocks|tsx|shares/.test(t))return 'Markets rise and fall again';
 if(/election|vote|politic/.test(t))return 'Ballots carry hopes and fears';
 if(/war|conflict|military/.test(t))return 'The world holds its breath again';
 if(/climate|heat|storm/.test(t))return 'Changing skies make headlines now';
 return random(newsLines[item.name]||newsLines['Google News']);
}
function culturalLine(item,kind){
 const t=((item.name||'')+' '+(item.title||'')).toLowerCase();
 if(kind==='literature'){
  if(/poetry|poem|haiku/.test(t))return 'Old poems bloom again';
  if(/novel|literature|fiction/.test(t))return 'A story takes root';
 }
 if(kind==='art'){
  if(/music|sound|electronic/.test(t))return 'A melody wakes';
  if(/paint|impression|renaissance|art/.test(t))return 'Old paintings still sing';
 }
 if(kind==='place'){
  if(/island|prince edward/.test(t))return 'The island remembers';
  if(/prague|praha|city|ottawa/.test(t))return 'A city dreams on';
 }
 return random(culturalLines[kind]);
}
function generate(){
 const [w,n,l,a,p]=ingredients;
 if(!w||!n||!l||!a||!p)return;
 const kind=['literature','art','place'][turn++%3];
 const third={literature:l,art:a,place:p}[kind];
 // Every poem combines at least three selected source categories.
 let lines=[weatherLine(w),newsLine(n),culturalLine(third,kind)];
 for(let i=0;i<5&&lines.join('|')===last;i++){
  lines=[weatherLine(w),newsLine(n),culturalLine(third,kind)];
 }
 last=lines.join('|');
 $('haiku').textContent=lines.join('\n');
 
}
function render(){
 const ul=$('ingredients');ul.replaceChildren();
 [...ingredients].sort(()=>Math.random()-0.5).forEach(x=>{
  const li=document.createElement('li'),a=document.createElement('a');
  a.textContent=x.name.startsWith('Wikipedia · ') ? x.name.slice(12) : (x.name.endsWith('weather') ? x.name.replace(' weather','')+' weather' : (x.ok && x.title && x.name !== 'TSX market movers (news)' ? x.title : x.name));
  a.href=x.link;a.target='_blank';a.rel='noopener noreferrer';
  li.append(a);ul.append(li);
 });

 generate();$('generate').disabled=false;
}
async function refresh(){
 $('generate').disabled=true;

 try{
  ingredients=await Promise.all([
   weather(...random(weatherPlaces)),news(random(feeds)),
   wikipediaTopic(random(literatureTopics)),
   wikipediaTopic(random(artTopics)),
   wikipediaTopic(random(placeTopics))
  ]);
  render();
 }catch(e){$('generate').disabled=false;generate()}
}
$('generate').addEventListener('click',refresh);
refresh();
</script></body></html>
